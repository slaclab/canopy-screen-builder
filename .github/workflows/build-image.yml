name: Build Image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Builds the image only. Deploying it is up to whoever runs it: pull the
  # `:<short sha>` or `:latest` tag from GHCR.
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # The bare short SHA, as slaclab/canopy tags its images, plus `latest`
          # on main.
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          # Pull requests build without pushing; pushes and manual runs on main
          # publish.
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BASE_PATH is baked into the bundle's asset URLs by Vite and rendered
          # into the nginx location blocks, so it must match the path the app is
          # served under. Changing it means changing the ingress or proxy too.
          build-args: |
            BASE_PATH=/screen-builder/
          cache-from: type=gha
          cache-to: type=gha,mode=max
